<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VÍDEOCREATOR</title><style>body{margin:0;font-family:Arial,sans-serif;background:#101522;color:#f5f7fb}.app{max-width:900px;margin:auto;padding:24px}.card{background:#1a2133;border-radius:16px;padding:20px;margin:16px 0}textarea{width:100%;min-height:90px;border-radius:10px;padding:12px;font-size:16px;box-sizing:border-box}button{margin-top:12px;padding:14px 20px;border:0;border-radius:10px;background:#6ee7b7;font-weight:bold}.agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.agent,.idea{background:#242d42;padding:14px;border-radius:10px}.status{color:#b8c0d0}.idea{border-left:4px solid #6ee7b7;margin:10px 0;line-height:1.5}</style></head><body><main class="app"><h1>🎬 VÍDEOCREATOR</h1><p>Sua central de agentes para criação de Shorts.</p><section class="card"><h2>💬 Comando</h2><textarea id="command">Crie 5 Shorts de curiosidades sobre o espaço</textarea><br><button onclick="runAgent()">🚀 EXECUTAR AGENTES</button><p id="status" class="status">Pronto para começar.</p></section><section class="card"><h2>🤖 Agentes</h2><div class="agents"><div class="agent">🔎 Pesquisa<br><small>Ativo</small></div><div class="agent">✍️ Roteiro<br><small>Próxima etapa</small></div><div class="agent">🎙️ Narração<br><small>Em breve</small></div><div class="agent">🎬 Vídeo<br><small>Em breve</small></div><div class="agent">📺 Publicação<br><small>Autorização oficial</small></div><div class="agent">📊 Análise<br><small>Em breve</small></div></div></section><section class="card"><h2>📋 Resultado</h2><div id="result">Digite um comando e clique em Executar.</div></section></main><script>const ideas=[['O espaço não é silencioso da forma que imaginamos','O som precisa de matéria para viajar, por isso o ambiente espacial é muito diferente da Terra.'],['Uma estrela de nêutrons é extremamente densa','Uma pequena quantidade de sua matéria teria um peso impressionante na Terra.'],['Um dia em Vênus é maior que seu ano','Vênus gira tão lentamente que sua rotação dura mais que sua viagem ao redor do Sol.'],['O universo é gigantesco','Existem quantidades impressionantes de estrelas e galáxias além do que conseguimos observar facilmente.'],['O Sol domina o Sistema Solar','Ele concentra aproximadamente 99,8% de toda a massa do nosso sistema.']];function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function runAgent(){const c=document.getElementById('command').value.trim(),st=document.getElementById('status'),r=document.getElementById('result');if(!c){st.textContent='Digite um comando primeiro.';return}st.textContent='🤖 Agente trabalhando: interpretando comando → criando ideias → planejando Shorts...';r.innerHTML='';setTimeout(()=>{r.innerHTML='<b>Comando recebido:</b> '+esc(c)+'<br><br><b>Ideias encontradas:</b>'+ideas.map((x,i)=>'<div class="idea"><b>'+(i+1)+'. '+x[0]+'</b><br>'+x[1]+'<br><small>🎯 Gancho: Você sabia disso? • ⏱️ 30–45 segundos</small></div>').join('');st.textContent='✅ Primeira etapa concluída! O próximo agente poderá transformar as ideias em roteiros completos.';localStorage.setItem('vc_cmd',c)},700)}const saved=localStorage.getItem('vc_cmd');if(saved)document.getElementById('command').value=saved;</script></body></html>
